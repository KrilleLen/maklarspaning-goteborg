name: Diagnostisera personalbygget

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-diagnostic.yml'

permissions:
  contents: write

concurrency:
  group: build-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testa alla bygglager
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -eux
            mkdir -p _site
            python3 scripts/decode_parts.py 'package/app.zip.b64.part*' app.zip 08a0407a01fc094c894798facefbbf2494228c0586e765378ba6d5a1ff8746ac
            unzip -q app.zip -d _site
            echo LAYER_BASE_OK

            python3 scripts/decode_parts.py 'overlays/v4/overlay.tar.xz.b64.part*' overlay-v4.tar.xz 23dbb54db029d7e0db8eac45267e94bf65602fce6787904c09ca094d0f68b398
            tar -xJf overlay-v4.tar.xz -C _site
            echo LAYER_V4_OK

            base64 --decode overlays/v5/v5.patch.xz.b64 > v5.patch.xz
            echo "9347999733eea24f7aa140b718651f736217cf0b53249f8bff9fe530159f4f1f  v5.patch.xz" | sha256sum --check
            xz -dc v5.patch.xz > v5.patch
            (cd _site && patch -p1 < ../v5.patch)
            echo LAYER_V5_OK

            python3 scripts/decode_parts.py 'overlays/v6/overlay.tar.xz.b64.part*' overlay-v6.tar.xz 33fcaec02492dd969ef003497ccfdf3b583ce418a75f98bc837e4659d148234e
            tar -xJf overlay-v6.tar.xz -C _site
            base64 --decode overlays/v6/v61.patch.xz.b64 > v61.patch.xz
            echo "09147b34c9da75b42eb54d9199b1dd6357619121220052e737b135049dbd93e3  v61.patch.xz" | sha256sum --check
            xz -dc v61.patch.xz > v61.patch
            (cd _site && patch -p1 < ../v61.patch)
            echo LAYER_V6_OK

            python3 scripts/decode_parts.py 'overlays/v7/overlay-v7.tar.xz.b64.part*' overlay-v7.tar.xz f439d71f49b9097bfe42d2570973703d0f551b2a95a5cd40b93b9f69a77fedef
            tar -xJf overlay-v7.tar.xz -C _site
            node --check _site/app.js
            python3 -m py_compile _site/scripts/update_people.py
            echo LAYER_V7_OK
          } 2>&1 | tee /tmp/build-diagnostic.log

      - name: Spara byggdiagnostik
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p reports
          cp /tmp/build-diagnostic.log reports/latest-build-diagnostic.log 2>/dev/null || true
          printf '{\n  "buildOutcome": "%s"\n}\n' "$BUILD_OUTCOME" > reports/latest-build-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest-build-diagnostic.log reports/latest-build-status.json
          git commit -m "Spara byggdiagnostik [skip ci]" || exit 0
          git pull --rebase origin main
          git push
