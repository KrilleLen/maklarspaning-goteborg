name: Publicera GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Bygg grundversionen
        run: |
          mkdir -p _site
          cat package/app.zip.b64.part* | base64 --decode > app.zip
          echo "08a0407a01fc094c894798facefbbf2494228c0586e765378ba6d5a1ff8746ac  app.zip" | sha256sum --check
          unzip -q app.zip -d _site

      - name: Lägg på kontorspersonal v4
        run: |
          cat overlays/v4/overlay.tar.xz.b64.part* | base64 --decode > overlay-v4.tar.xz
          echo "23dbb54db029d7e0db8eac45267e94bf65602fce6787904c09ca094d0f68b398  overlay-v4.tar.xz" | sha256sum --check
          tar -xJf overlay-v4.tar.xz -C _site
          node --check _site/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('_site/data/app-data.json').read_text())
          assert len(data['companies']) == 45
          assert len(data['offices']) == 91
          assert len(data['workforce']) == 21
          assert len(data['marketAreas']) >= 8

          eo = next(row for row in data['companies'] if row.get('isOwn'))
          assert len(eo.get('history', [])) == 5

          exact = [o for o in data['offices'] if o.get('staffScope') == 'office']
          assert len(exact) >= 39
          fastighetsbyran = [o for o in data['offices'] if o.get('brand') == 'Fastighetsbyrån']
          assert len(fastighetsbyran) == 18
          assert all(o.get('staffScope') == 'office' and o.get('staffUrl') for o in fastighetsbyran)

          app = Path('_site/app.js').read_text()
          for phrase in [
              'Vad kräver vår uppmärksamhet?',
              'Kontor under press',
              'Områdesradar',
              'Rekryteringsscore',
              'Kontorsspecifik personlista',
              'Kedjans personal',
          ]:
              assert phrase in app

          sw = Path('_site/sw.js').read_text()
          assert 'maklarspaning-v4-20260724' in sw
          print('Kontorspersonal v4 godkänd: 39 kontorsspecifika länkar')
          PY
          rm -rf _site/.github _site/source _site/package _site/overlays

      - name: Konfigurera Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp webbappen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
