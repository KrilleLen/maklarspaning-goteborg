name: Publicera Mäklarspaning v8

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Verifiera och publicera v8
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Hämta repositoryt
        uses: actions/checkout@v4

      - name: Kontrollera appen
        shell: bash
        run: |
          set -euo pipefail
          node --check site/app.js
          node scripts/test-bolagsverket-import.mjs
          node scripts/test-financial-import.mjs
          node scripts/validate-financial-data.mjs site/data/app-data.json
          node scripts/test-financial-ui.mjs
          test -s site/styles.css
          test -s site/data/app-data.json
          test -s site/data/financial-import.schema.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('site/data/app-data.json').read_text())
          app = Path('site/app.js').read_text()
          index = Path('site/index.html').read_text()

          assert len(data['companies']) == 45
          assert len(data['offices']) == 91
          assert len(data.get('officePeople', [])) == 50
          assert len({company['orgNo'] for company in data['companies']}) == 45
          assert "const APP_VERSION = '8.0';" in app
          assert 'financialTabNavigation' in app
          assert 'financialStatementTable' in app
          assert 'v8.0' in index
          print('Mäklarspaning v8 är verifierad och redo för publicering')
          PY

      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5

      - name: Skapa Pages-paket
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
