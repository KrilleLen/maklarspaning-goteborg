name: Publicera GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Bygg komplett version 7
        run: |
          mkdir -p _site
          python3 scripts/decode_parts.py \
            'bundles/v7/maklarspaning-v7-full.tar.xz.b64.part*' \
            maklarspaning-v7-full.tar.xz \
            512de2ad98c292283cc36406b12edb28a3c35fbe527e7373d87da9a283a5fda0
          tar -xJf maklarspaning-v7-full.tar.xz -C _site
          node --check _site/app.js
          python3 -m py_compile _site/scripts/update_people.py

      - name: Hämta personal för samtliga 91 kontor
        run: |
          python3 -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
          python3 _site/scripts/update_people.py \
            _site/data/app-data.json \
            --report _site/data/people-report.json

      - name: Verifiera täckning och app
        run: |
          node --check _site/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('_site/data/app-data.json').read_text())
          report = json.loads(Path('_site/data/people-report.json').read_text())
          coverage = report['coverage']

          assert len(data['companies']) == 45
          assert len(data['offices']) == 91
          assert coverage['officeCount'] == 91
          assert all(office.get('peopleStatus') for office in data['offices'])
          assert all('peopleCount' in office for office in data['offices'])
          assert coverage['officeAssignments'] >= 50
          assert "const APP_VERSION = '7.0'" in Path('_site/app.js').read_text()
          assert 'maklarspaning-v7-20260724' in Path('_site/sw.js').read_text()
          print('Personalkontroll v7:', json.dumps(coverage, ensure_ascii=False))
          PY
          rm -rf _site/scripts

      - name: Konfigurera Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp webbappen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
