name: Publicera GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Bygg direktversion 7.2
        run: |
          mkdir -p _site/v72 _site/icons
          cp index.html latest.html manifest.webmanifest favicon.svg sw.js .nojekyll _site/
          cp -r icons/* _site/icons/
          cp v72/styles.css.gz.b64 _site/v72/
          cp v72/app.direct.js.gz.b64.s* _site/v72/
          cp v72/app-data.json.gz.b64.s* _site/v72/

          python3 - <<'PY'
          import base64, gzip, json
          from pathlib import Path

          base = Path('_site/v72')
          app_b64 = ''.join((base / f'app.direct.js.gz.b64.s{i}').read_text().strip() for i in range(1, 9))
          data_b64 = ''.join((base / f'app-data.json.gz.b64.s{i}').read_text().strip() for i in range(1, 6))
          app = gzip.decompress(base64.b64decode(app_b64)).decode()
          data = json.loads(gzip.decompress(base64.b64decode(data_b64)))
          css = gzip.decompress(base64.b64decode((base / 'styles.css.gz.b64').read_text())).decode()

          assert "const APP_VERSION = '7.2'" in app
          assert 'renderOfficePeopleInline' in app
          assert 'office-inline-people' in css
          assert len(data['companies']) == 45
          assert len(data['offices']) == 91
          assert len(data.get('officePeople', [])) >= 50
          assert 'v7.2' in Path('_site/index.html').read_text()
          assert 'latest.html?v=7.2' in Path('_site/manifest.webmanifest').read_text()
          print('Direktversion v7.2 verifierad')
          PY

      - name: Konfigurera Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp webbappen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
