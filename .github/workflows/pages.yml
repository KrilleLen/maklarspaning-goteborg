name: Publicera GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Bygg stabil version 7.1
        run: |
          mkdir -p _site
          python3 scripts/decode_parts.py \
            'bundles/v7/maklarspaning-v7-full.tar.xz.b64.part*' \
            maklarspaning-v7-full.tar.xz \
            512de2ad98c292283cc36406b12edb28a3c35fbe527e7373d87da9a283a5fda0
          tar -xJf maklarspaning-v7-full.tar.xz -C _site

          base64 --decode overlays/v71/v71.patch.xz.b64 > v71.patch.xz
          echo "1218473a90a839ddcf95b80a62dd5b6cba18b251228d04854dea6b9eace601f4  v71.patch.xz" | sha256sum --check
          xz -dc v71.patch.xz > v71.patch
          (cd _site && patch -p1 < ../v71.patch)

          node --check _site/app.js
          python3 -m py_compile _site/scripts/update_people.py

      - name: Försök uppdatera publik personal
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
          python3 _site/scripts/update_people.py \
            _site/data/app-data.json \
            --report _site/data/people-report.json

      - name: Verifiera mobilflöde och grunddata
        run: |
          node --check _site/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('_site/data/app-data.json').read_text())
          app = Path('_site/app.js').read_text()
          styles = Path('_site/styles.css').read_text()
          sw = Path('_site/sw.js').read_text()
          index = Path('_site/index.html').read_text()

          assert len(data['companies']) == 45
          assert len(data['offices']) == 91
          assert len(data.get('officePeople', [])) >= 50
          assert "const APP_VERSION = '7.1'" in app
          assert 'renderOfficePeopleInline' in app
          assert 'Dölj personal' in app
          assert 'office-inline-people' in styles
          assert 'maklarspaning-v7-1-20260724' in sw
          assert 'v7.1' in index
          print('Mobilfix v7.1 godkänd: personal fälls ut direkt under kontoret')
          PY
          rm -rf _site/scripts

      - name: Konfigurera Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp webbappen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
