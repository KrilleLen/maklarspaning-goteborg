name: Publicera GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicera ren v7.4
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hämta repositoryt
        uses: actions/checkout@v4

      - name: Packa upp den verifierade webbappen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          tar -xzf site-v7.4.tar.gz -C _site
          node --check _site/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('_site/data/app-data.json').read_text())
          app = Path('_site/app.js').read_text()
          index = Path('_site/index.html').read_text()

          assert len(data['companies']) == 45
          assert len(data['offices']) == 91
          assert len(data.get('officePeople', [])) == 50
          assert "const APP_VERSION = '7.4';" in app
          assert 'renderOfficePeopleInline' in app
          assert 'v7.4' in index
          assert 'DecompressionStream' not in index
          print('Ren v7.4 verifierad och klar för publicering')
          PY

      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5

      - name: Skapa Pages-paket
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
