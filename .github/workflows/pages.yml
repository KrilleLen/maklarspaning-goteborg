name: Publicera GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicera v7.3 stabil
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Hämta repositoryt
        uses: actions/checkout@v4

      - name: Bygg färdiga webbfiler på GitHub
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, json, re, shutil
          from pathlib import Path

          root = Path('.')
          site = Path('_site')
          (site / 'data').mkdir(parents=True, exist_ok=True)
          (site / 'icons').mkdir(parents=True, exist_ok=True)

          def numbered_parts(pattern):
              paths = list(root.glob(pattern))
              def number(path):
                  match = re.search(r'\.s(\d+)$', path.name)
                  return int(match.group(1)) if match else 0
              return sorted(paths, key=number)

          def unpack(pattern):
              paths = numbered_parts(pattern)
              if not paths:
                  raise RuntimeError(f'Inga delar hittades: {pattern}')
              encoded_parts = []
              for item in paths:
                  encoded_parts.append(''.join(item.read_text().split()))
              encoded = ''.join(encoded_parts)
              return gzip.decompress(base64.b64decode(encoded))

          css = unpack('v72/styles.css.gz.b64')
          app = unpack('v72/app.direct.js.gz.b64.s*').decode('utf-8')
          data_bytes = unpack('v72/app-data.json.gz.b64.s*')

          app = re.sub(r"const APP_VERSION = '[^']+';", "const APP_VERSION = '7.3';", app, count=1)
          data = json.loads(data_bytes)
          assert len(data['companies']) == 45
          assert len(data['offices']) == 91
          assert len(data.get('officePeople', [])) >= 50
          assert 'renderOfficePeopleInline' in app

          index = Path('index.html').read_text()
          assert 'v7.3' in index
          assert 'DecompressionStream' not in index

          (site / 'index.html').write_text(index)
          (site / '404.html').write_text(index)
          (site / 'latest.html').write_text(index)
          (site / 'styles.css').write_bytes(css)
          (site / 'app.js').write_text(app)
          (site / 'data' / 'app-data.json').write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')))

          for name in ['manifest.webmanifest', 'favicon.svg', 'sw.js']:
              shutil.copy2(name, site / name)
          for icon in Path('icons').iterdir():
              if icon.is_file():
                  shutil.copy2(icon, site / 'icons' / icon.name)
          (site / '.nojekyll').touch()
          print('v7.3 byggd som vanliga filer')
          PY
          node --check _site/app.js
          test -s _site/styles.css
          test -s _site/data/app-data.json

      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5

      - name: Skapa Pages-paket
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicera v7.3
        id: deployment
        uses: actions/deploy-pages@v4
