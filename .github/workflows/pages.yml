name: Publicera GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Bygg grundversionen
        run: |
          mkdir -p _site
          cat package/app.zip.b64.part* | base64 --decode > app.zip
          echo "08a0407a01fc094c894798facefbbf2494228c0586e765378ba6d5a1ff8746ac  app.zip" | sha256sum --check
          unzip -q app.zip -d _site

      - name: Lägg på delägarversion v3
        run: |
          cat overlays/v3/overlay.tar.xz.b64.part* | base64 --decode > overlay-v3.tar.xz
          echo "723dd696a3736c85075def298189461b1a967cdb9457ff9bd3ca3bc94a5aa5af  overlay-v3.tar.xz" | sha256sum --check
          tar -xJf overlay-v3.tar.xz -C _site
          node --check _site/app.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('_site/data/app-data.json').read_text())
          assert len(data['companies']) == 45
          assert len(data['offices']) == 91
          assert len(data['workforce']) == 21
          assert len(data['marketAreas']) >= 8

          eo = next(row for row in data['companies'] if row.get('isOwn'))
          assert len(eo.get('history', [])) == 5

          app = Path('_site/app.js').read_text()
          for phrase in [
              'Vad kräver vår uppmärksamhet?',
              'Kontor under press',
              'Områdesradar',
              'Rekryteringsscore',
          ]:
              assert phrase in app

          print('Delägarversion v3 godkänd')
          PY
          rm -rf _site/.github _site/source _site/package _site/overlays

      - name: Konfigurera Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp webbappen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4