<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1724">
  <title>Uppdaterar Mäklarspaning</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111b;color:#f4f7fa;font:600 18px system-ui;text-align:center;padding:24px;box-sizing:border-box}strong{color:#b7ff3c;font-size:28px;display:block;margin-bottom:12px}.loader{width:44px;height:44px;border:4px solid #294052;border-top-color:#b7ff3c;border-radius:50%;animation:s 0.8s linear infinite;margin:22px auto}@keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main><strong>Uppdaterar till v7.2</strong><div class="loader"></div><p>Tar bort den gamla offlineversionen…</p></main>
  <script>
  (async()=>{
    try {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(registration => registration.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(key => caches.delete(key)));
      }
    } finally {
      location.replace('./?v=7.2-direct-20260724-2120');
    }
  })();
  </script>
</body>
</html>
